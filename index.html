<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <meta charset="UTF-8">
  <title>Hayden Hedman</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f9f9f9;
      color: #333;
    }

    .navbar {
      background-color: #214c38;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      color: white;
      flex-wrap: wrap;
    }

    .navbar-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .navbar-title a {
      color: white;
      text-decoration: none;
      font-size: 1.5rem;
    }

    .landing {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 2rem;
      max-width: 960px;
      margin: 0 auto;
    }

    .profile-pic {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #ccc;
    }

    .profile-title {
      margin-top: 1rem;
      font-weight: 500;
      font-size: 1.2rem;
      color: #444;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-top: 1.5rem;
    }

    .social-icons a img {
      width: 28px;
      height: 28px;
      filter: grayscale(100%);
      transition: filter 0.3s;
    }

    .social-icons a img:hover {
      filter: none;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="navbar-title">
      <a href="#">Hayden Hedman</a>
    </div>
  </div>

  <div class="landing">
    <img src="assets/img/portfolio_profile.jpg" alt="Hayden Hedman" class="profile-pic">
    <p class="profile-title">Data Scientist</p>

    <div class="social-icons">
      <a href="https://github.com/h-hedman" target="_blank">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg" alt="GitHub">
      </a>
      <a href="https://www.linkedin.com/in/hayden-hedman/" target="_blank">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/linkedin.svg" alt="LinkedIn">
      </a>
      <a href="https://scholar.google.com/citations?user=UW_UW9QAAAAJ&hl=en" target="_blank">
        <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/googlescholar.svg" alt="Google Scholar">
      </a>
    </div>
  </div>

</body>
</html>
